    <style>
        /* Centers everything perfectly from Left to Right */
        body {
            background-color: #FFFFFF;
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* Handles the horizontal centering */
            gap: 40px; /* Space between each stacked image */
        }

        /* Container to manage image width */
        .image-link {
            display: block;
            width: 80%;
            max-width: 800px; /* Keeps them from getting too wide on desktop */
        }

        /* Makes images responsive and fills the container */
        .image-link img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Mobile layout */
        @media screen and (orientation: portrait) {
            .image-link {
                width: 90%;
            }
        }
    </style>
</head>

<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BH770.com</title>

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="Mon, 01 Jan 1990 12:00:00 GMT">

    <meta property="og:title" content="BH770.com">
    <meta property="og:image" content="https://BH770.com/logo.png">

    <meta name="twitter:card" content="summary_large_image">

    <style>
        /* Centers everything perfectly from Left to Right */
        body {
            background-color: #FFFFFF;
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* Handles the horizontal centering */
            gap: 40px; /* Space between each stacked image */
        }

        /* Controls sizing and centering for both the logo div and the standalone images */
        .image-link {
            display: block;
            width: 80%;
            max-width: 800px; /* Keeps them from getting too wide on desktop */
            height: auto;
        }

        /* Ensures the logo inside the div fills its container properly */
        .image-link img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Mobile layout optimization */
        @media screen and (orientation: portrait) {
            .image-link {
                width: 90%; /* Uses more screen real estate on mobile screens */
            }
        }
    </style>
</head>
<body>



    <img class="image-link" src="image01.png" alt="Image 1" />
    <img class="image-link" src="image02.png" alt="Image 2" />
    <img class="image-link" src="image03.png" alt="Image 3" />
    <img class="image-link" src="image04.png" alt="Image 4" />
    <img class="image-link" src="image05.png" alt="Image 5" />
    <img class="image-link" src="image06.png" alt="Image 6" />

</body>
